# Rebuilds servers.csv every hour from several free OpenVPN sources (see mirror.py),
# so the app can fetch it over HTTPS from raw.githubusercontent.com even where the
# sources themselves are blocked.
name: Mirror VPN server list

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build list
        run: python3 mirror.py
      - name: Commit
        run: |
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add servers.csv seen.json
          git diff --cached --quiet || git commit -m "Update server list"
          git push
